name: Build cmkagent APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-cmkagent.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate sdkmanager
        id: sdk
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager || true
            exit 1
          fi
          echo "Found sdkmanager: $SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "${{ steps.sdk.outputs.sdkmanager }}" --licenses || true

      - name: Install Android SDK 35
        shell: bash
        run: |
          "${{ steps.sdk.outputs.sdkmanager }}" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Validasi atau generate keystore PKCS12 yang valid
      - name: Ensure Valid Signing Keystore
        shell: bash
        run: |
          if ! keytool -list -keystore android/app/cmkagent.keystore -storepass android >/dev/null 2>&1; then
            echo "Keystore tidak ditemukan atau corrupt. Membuat keystore baru yang valid..."
            rm -f android/app/cmkagent.keystore
            keytool -genkeypair -v \
              -keystore android/app/cmkagent.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias cmkagent \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=cmkagent, OU=IT, O=BCP, L=Kediri, ST=EastJava, C=ID"
          else
            echo "Keystore valid ditemukan."
          fi

      - name: Build cmkagent debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/cmkagent-v1.3.4.apk

      # Upload APK bersama file keystore sebagai artifact
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmkagent-v1.3.4
          path: |
            android/cmkagent-v1.3.4.apk
            android/app/cmkagent.keystore
